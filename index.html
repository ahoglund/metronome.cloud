<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>metronome.cloud - Polyrhythmic Metronome</title>
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/main.css">
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
    <script type="module" src="js/polyrhythmic-metronome.js"></script>
  </head>
  <body>
    <div class="app-container">
      
      <!-- Global Controls -->
      <header class="global-controls">
        <div class="logo-header">
          <div class="metronome-icon">
            <div class="icon-grid">
              <div class="grid-square"></div>
              <div class="grid-square accent"></div>
              <div class="grid-square"></div>
              <div class="grid-square"></div>
              <div class="grid-square accent"></div>
              <div class="grid-square empty"></div>
              <div class="grid-square"></div>
              <div class="grid-square"></div>
              <div class="grid-square accent"></div>
            </div>
          </div>
          <div class="logo-text">
            <h1 class="brand-name">cloud metronome</h1>
          </div>
        </div>
        
        <div class="header-links">
          <a href="https://github.com/ahoglund/metronome.cloud/issues" target="_blank" class="header-link">
            Report Bug / Request Feature
          </a>
         <stripe-buy-button
            buy-button-id="buy_btn_1S3dknKyNCgUX0zguG2ik3H7"
            publishable-key="pk_live_51IvCOSKyNCgUX0zgfoyrRapP6iNZ7FxpbaCHF5v3lL2XcFGIN0SJeQ1slG4SnLi6Ws8bk0SdFQs4lvTsEzNarcOg00uxTK7G27"
            class="stripe-buy-button"
          >
          </stripe-buy-button>

        </div>
        
      </header>

      <!-- Reference Track Section -->
      <section class="reference-section">
        <div class="main-controls-panel">
          <div class="reference-track" id="reference-track">
            <!-- Reference track will be created here -->
          </div>
          <div class="transport-panel">
            <div id="tempo-knob"></div>
            <div class="tempo-buttons">
              <button id="tempo-up-button" class="tempo-btn">+</button>
              <button id="tempo-down-button" class="tempo-btn">-</button>
            </div>
            <button id="toggle-button" class="play-button">
              <span id="play-icon">▶</span>
            </button>
            <button class="tap-button" id="tap-tempo-button">TAP TEMPO</button>
            <button class="add-track-button" id="add-polyrhythm-button">Add Polyrhythm</button>
          </div>
        </div>

        <!-- Practice Mode Panel -->
        <div class="practice-mode-panel">
          <div class="practice-mode-header">
            <span class="practice-mode-label">Practice Mode</span>
            <div id="practice-mode-bar-counter" class="bar-counter">
              Bar <span id="bar-count">0</span>/<span id="bar-total">8</span>
            </div>
          </div>
          <div class="practice-mode-controls">
            <div class="practice-control-group">
              <label>BPM Increase</label>
              <div class="practice-button-group">
                <button class="practice-preset-btn active" data-value="0">0</button>
                <button class="practice-preset-btn" data-value="2">2</button>
                <button class="practice-preset-btn" data-value="5">5</button>
                <button class="practice-preset-btn" data-value="10">10</button>
                <div class="practice-adjust-buttons">
                  <button class="practice-adjust-btn" id="bpm-increase-down">-</button>
                  <span class="practice-value" id="bpm-increase-value">0</span>
                  <button class="practice-adjust-btn" id="bpm-increase-up">+</button>
                </div>
              </div>
            </div>
            <div class="practice-control-group">
              <label>Bars per Increase</label>
              <div class="practice-button-group">
                <button class="practice-preset-btn" data-value="2">2</button>
                <button class="practice-preset-btn" data-value="4">4</button>
                <button class="practice-preset-btn active" data-value="8">8</button>
                <button class="practice-preset-btn" data-value="16">16</button>
                <button class="practice-preset-btn" data-value="32">32</button>
                <div class="practice-adjust-buttons">
                  <button class="practice-adjust-btn" id="bars-per-increase-down">-</button>
                  <span class="practice-value" id="bars-per-increase-value">8</span>
                  <button class="practice-adjust-btn" id="bars-per-increase-up">+</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tracks-container" id="polyrhythms-container">
          <!-- Polyrhythm tracks will be added here dynamically -->
        </div>

      </section>
    </div>
  </body>
</html>
